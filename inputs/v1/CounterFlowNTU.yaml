# FMU Configuration File - CounterFlowNTU
# SIMPLIFIED FOR PARAMETER-ONLY SIMULATION

metadata:
  name: "Counter Flow Heat Exchanger - NTU Method"
  version: "1.0.0"
  description: "Heat exchanger model using Number of Transfer Units method"
  author: "Thermal Systems Team"
  tolerance: 0.001
  supported_modes: ["scenario"]  # Parameter-based only

# Parameters: Set at initialization, fixed for simulation run
parameters:
  - name: sourceA.T0_par
    label: "Hot Source Temperature"
    description: "Design temperature for hot fluid source"
    unit: "K"
    default: 353.15
    min: 273.15
    max: 400.0
    tweakable: true
    
  - name: sourceB.T0_par
    label: "Cold Source Temperature"
    description: "Design temperature for cold fluid source"
    unit: "K"
    default: 293.15
    min: 273.15
    max: 350.0
    tweakable: true

# Outputs: What the simulation returns
outputs:
  - name: multiSensor_Tpm.T
    label: "Hot Outlet Temperature"
    description: "Temperature of hot fluid leaving heat exchanger"
    unit: "K"
    
  - name: multiSensor_Tpm1.T
    label: "Cold Outlet Temperature"
    description: "Temperature of cold fluid leaving heat exchanger"
    unit: "K"

# Testing configuration
testing:
  mode: "parameter_based"
