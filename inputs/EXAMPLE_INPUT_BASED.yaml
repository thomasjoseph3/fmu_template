# Example FMU Configuration: Digital Twin Mode
# This is how you'd configure an FMU with runtime inputs

metadata:
  name: "Dynamic Heat Exchanger"
  version: "2.0.0"
  description: "Real-time heat exchanger with transient dynamics"
  tolerance: 0.001
  supported_modes: ["digital_twin"]

# Design parameters (set once at initialization)
parameters:
  - name: hex.UA_par
    label: "Overall Heat Transfer Coefficient"
    unit: "W/K"
    default: 1000.0
    min: 500.0
    max: 5000.0
    tweakable: true

# Runtime inputs (change every time step)
inputs:
  - name: hot_inlet.T
    label: "Hot Inlet Temperature"
    description: "Sensor: Temperature at hot fluid inlet"
    unit: "K"
    required: true
    expected_range: [273.15, 400.0]
    
  - name: cold_inlet.T
    label: "Cold Inlet Temperature"
    description: "Sensor: Temperature at cold fluid inlet"
    unit: "K"
    required: true
    expected_range: [273.15, 350.0]
    
  - name: hot_inlet.m_flow
    label: "Hot Flow Rate"
    description: "Sensor: Mass flow rate of hot fluid"
    unit: "kg/s"
    required: false
    default: 0.5
    expected_range: [0.0, 2.0]

# Simulation outputs
outputs:
  - name: hot_outlet.T
    label: "Hot Outlet Temperature"
    unit: "K"
    
  - name: cold_outlet.T
    label: "Cold Outlet Temperature"
    unit: "K"
    
  - name: heat_transfer.Q
    label: "Heat Transfer Rate"
    unit: "W"

# Testing configuration
testing:
  mode: "input_based"
